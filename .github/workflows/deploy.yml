name: Build, Test & Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Laravel image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/laravel/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/pistonman33/myhomehub-laravel:latest
            ghcr.io/pistonman33/myhomehub-laravel:${{ github.sha }}

      - name: Build and push Static image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/pistonman33/myhomehub-static:latest
            ghcr.io/pistonman33/myhomehub-static:${{ github.sha }}

  tests:
    needs: build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myhomehub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h mysql -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CI image
        run: |
          docker build \
            -t myhomehub-ci \
            -f docker/laravel/Dockerfile.ci .

      - name: Run tests
        run: |
          docker run --rm \
            --network host \
            -w /var/www \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_DATABASE=myhomehub_test \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            myhomehub-ci \
            sh -c "
              php artisan config:clear &&
              php artisan migrate --force &&
              php artisan test
            "

  deploy:
    needs: [build, tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker/prod/docker-compose.yml"
          target: "/opt/"

      - name: Copy README.md file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker/prod/README.md"
          target: "/opt/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/docker/prod
            export IMAGE_TAG=${{ github.sha }}

            echo "Pull image for commit $IMAGE_TAG"
            docker compose config
            docker compose pull

            echo "Restart stack"
            docker compose up -d --pull always --force-recreate --remove-orphans

            echo "Deployed image versions"
            docker compose images

            echo "Verify deployed Laravel source"
            docker exec myhomehub_laravel sh -c "grep -q \"Route::get('dashboard', 'FinanceController@annualDashboard')\" /var/www/routes/backend.php"
            docker exec myhomehub_laravel sh -c "grep -q 'annualDashboard' /var/www/app/Http/Controllers/Backend/FinanceController.php"
            test "$(docker exec myhomehub_laravel php artisan route:list --path=admin/finance/dashboard --no-ansi | grep -c 'admin/finance/dashboard')" -gt 0

            echo "Cleanup"
            docker image prune -f
